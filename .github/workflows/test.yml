name: Test

# Builds and tests this library against a pinned release of
# github.com/qrazil/m31. This is a library, not a standalone app -- tests/tests.m31,
# examples/bench.m31, demo.m31 and browse.m31 each compile by m31c and then link, as
# ordinary C, against the m31 runtime's own source files directly (there is
# no pre-built runtime library to link against instead). qrazil/m31's own
# release tarballs bundle exactly that (config.sh + runtime/, see that
# repo's release.yml and docs/apps-repo-split-decision.md), alongside the
# compiler binary itself -- so each job here just downloads and extracts one
# tarball. No git clone of that repo, no Rust toolchain: `curl`, `tar` and a
# C compiler are everything this needs.
#
# release.yml publishes a source tarball only: unlike httpserver/markdown, this
# library has no single binary to ship. A program uses it as a dependency
# (`tui <url> <ref>` in its deps file, `import tui.tuiapp;`; m31 v0.2.0+) --
# see README.md's "This library is not part of the standard library".
#
# Bump M31_REF by hand when this library should pick up a newer m31 release
# -- see qrazil/m31's own docs/apps-repo-split-decision.md section 6a for
# why this is a manual step, not automatic, and the tradeoffs of the
# alternatives (tracking `latest`, or a cross-repo bump-PR bot).
env:
  M31_REF: v0.2.0

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch: {}
  workflow_call: {}

jobs:
  test-linux-x86_64:
    name: Test — Linux x86-64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and extract the m31 release (${{ env.M31_REF }})
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/m31.tar.gz" \
            "https://github.com/qrazil/m31/releases/download/${{ env.M31_REF }}/m31-linux-x86_64.tar.gz"
          mkdir -p "$RUNNER_TEMP/m31"
          tar -C "$RUNNER_TEMP/m31" -xzf "$RUNNER_TEMP/m31.tar.gz"
          chmod +x "$RUNNER_TEMP/m31/m31c"
          echo "LANGC=$RUNNER_TEMP/m31/m31c" >> "$GITHUB_ENV"
          echo "M31_ROOT=$RUNNER_TEMP/m31" >> "$GITHUB_ENV"

      - name: Check
        run: bash scripts/check.sh

  test-linux-aarch64:
    name: Test — Linux aarch64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Download and extract the m31 release (${{ env.M31_REF }})
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/m31.tar.gz" \
            "https://github.com/qrazil/m31/releases/download/${{ env.M31_REF }}/m31-linux-aarch64.tar.gz"
          mkdir -p "$RUNNER_TEMP/m31"
          tar -C "$RUNNER_TEMP/m31" -xzf "$RUNNER_TEMP/m31.tar.gz"
          chmod +x "$RUNNER_TEMP/m31/m31c"
          echo "LANGC=$RUNNER_TEMP/m31/m31c" >> "$GITHUB_ENV"
          echo "M31_ROOT=$RUNNER_TEMP/m31" >> "$GITHUB_ENV"

      - name: Check
        run: bash scripts/check.sh

  test-macos-arm64:
    name: Test — macOS (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Download and extract the m31 release (${{ env.M31_REF }})
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/m31.tar.gz" \
            "https://github.com/qrazil/m31/releases/download/${{ env.M31_REF }}/m31-macos-arm64.tar.gz"
          mkdir -p "$RUNNER_TEMP/m31"
          tar -C "$RUNNER_TEMP/m31" -xzf "$RUNNER_TEMP/m31.tar.gz"
          chmod +x "$RUNNER_TEMP/m31/m31c"
          echo "LANGC=$RUNNER_TEMP/m31/m31c" >> "$GITHUB_ENV"
          echo "M31_ROOT=$RUNNER_TEMP/m31" >> "$GITHUB_ENV"

      - name: Check
        run: bash scripts/check.sh
